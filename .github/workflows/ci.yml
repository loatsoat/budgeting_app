name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - run: flutter pub get
      # Infos are deprecation hints only; warnings and errors still fail the build.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
